<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M Lhuillier — Admin Dashboard</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #cc0000;
    --primary-hover: #a00000;
    --dark-navy: #0f172a;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text: #334155;
    --text-muted: #64748b;
    --active-tab-bg: #0f172a;
    --active-tab-text: #ffffff;
    --inactive-tab-bg: #edf2f7;
    --inactive-tab-text: #334155;
    --radius-pill: 12px;
    --radius-search: 30px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-main);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 32px 28px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }

  /* HEADER BRAND & LOGOUT */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .brand-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-logout {
    background: #f1f5f9;
    color: #0f172a;
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-logout:hover { background: #e2e8f0; }

  /* NAVIGATION TABS DESIGN */
  .tab-navigation {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .nav-tab {
    background: var(--inactive-tab-bg);
    color: var(--inactive-tab-text);
    padding: 12px 24px;
    border-radius: var(--radius-pill);
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .nav-tab.active {
    background: var(--active-tab-bg);
    color: var(--active-tab-text);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
  }

  /* ROUNDED SEARCH BAR */
  .search-container {
    margin-bottom: 28px;
  }

  .search-wrapper {
    position: relative;
    max-width: 500px;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
  }

  .input-search-pill {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border-radius: var(--radius-search);
    border: 1px solid #cbd5e1;
    font-size: 14px;
    outline: none;
    color: var(--text);
    transition: border-color 0.2s;
  }

  .input-search-pill:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(204,0,0,0.1);
  }

  /* TAB CONTENT PANELS */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .panel-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .list-item:last-child { border-bottom: none; }

  .btn-action {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-action:hover { background: #a00000; }

  /* ENROLL USER MODAL OVERLAY (KAPAREHAS SA PICTURE) */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    display: flex; justify-content: center; align-items: center;
    z-index: 9999; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px;
    width: 90%;
    max-width: 440px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    position: relative;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--dark-navy);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .close-modal-btn {
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text-muted);
    cursor: pointer;
  }

  .form-group-modal {
    margin-bottom: 14px;
    text-align: left;
  }

  .form-group-modal label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .input-modal {
    width: 100%;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #cbd5e1;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }

  .input-modal:focus {
    border-color: var(--primary);
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }

  .btn-cancel {
    background: #edf2f7;
    color: var(--text);
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }

  .btn-enroll-submit {
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-enroll-submit:hover { background: var(--primary-hover); }
</style>
</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="header-top">
    <div class="brand-title">
      <img src="logo.png" height="32" alt="ML Logo" onerror="this.style.display='none';">
      <span>M Lhuillier QCL Audit Portal</span>
    </div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <!-- TABS NAVIGATION -->
  <div class="tab-navigation">
    <button class="nav-tab active" id="tab-btn-audit" onclick="switchTab('audit')">
      📋 All Liquidations Audit
    </button>
    <button class="nav-tab" id="tab-btn-users" onclick="switchTab('users')">
      👥 User Profiles & Credentials
    </button>
  </div>

  <!-- SEARCH BAR -->
  <div class="search-container">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="dashboard-search" class="input-search-pill" placeholder="Search User Name, Email, or Region...">
    </div>
  </div>

  <!-- CONTENT 1: ALL LIQUIDATIONS / BRANCHES AUDIT -->
  <div id="content-audit" class="tab-content active">
    <div class="panel-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:16px; font-weight:800; color:var(--dark-navy);">🏢 Registered Branch Inventories</h3>
        <button class="btn-action" onclick="toggleAddBranch()">+ Enroll Branch</button>
      </div>

      <div id="add-branch-box" style="display:none; background:#f8fafc; padding:16px; border-radius:12px; margin-bottom:16px; border:1px solid var(--border);">
        <div style="margin-bottom:10px;">
          <label style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Branch Name</label>
          <input type="text" id="new-branch-input" class="input-modal" style="border-radius:8px;" placeholder="e.g. ML Catarman Main">
        </div>
        <button class="btn-action" onclick="saveNewBranch()" style="width:100%;">Save Branch</button>
      </div>

      <div id="branches-list">
        <div class="list-item">
          <div>
            <strong>ML Catarman</strong>
            <div style="font-size:12px; color:var(--text-muted);">Region: Visayas</div>
          </div>
          <button class="btn-action" onclick="openBranch('ML Catarman')">Open Audit Engine</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENT 2: USER PROFILES & CREDENTIALS -->
  <div id="content-users" class="tab-content">
    <div class="panel-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:16px; font-weight:800; color:var(--dark-navy);">👥 User Profiles & Credentials</h3>
        <button class="btn-action" onclick="openEnrollModal()">+ Enroll New User</button>
      </div>

      <!-- Enrolled Users List -->
      <div id="users-list">
        <div class="list-item">
          <div>
            <strong>System Administrator</strong>
            <div style="font-size:12px; color:var(--text-muted);">Username: admin | StrikeForce/Fraud Audit-IAD</div>
          </div>
          <span style="font-size:12px; font-weight:700; color:#16a34a;">Active</span>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ENROLL NEW USER MODAL POPUP (BAG-O GIKAN SA PICTURE) -->
<div id="enroll-modal-overlay" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span style="color:var(--primary); font-size:18px;">+</span> Enroll New User
      </div>
      <button class="close-modal-btn" onclick="closeEnrollModal()">✕</button>
    </div>

    <form id="enroll-form" onsubmit="handleEnrollUser(event)">
      <div class="form-group-modal">
        <label>USERNAME</label>
        <input type="text" id="modal-username" class="input-modal" placeholder="e.g. j.doe" required>
      </div>

      <div class="form-group-modal">
        <label>FULL NAME</label>
        <input type="text" id="modal-fullname" class="input-modal" placeholder="e.g. Jane Doe" required>
      </div>

      <div class="form-group-modal">
        <label>DESIGNATION / POSITION</label>
        <input type="text" id="modal-position" class="input-modal" placeholder="Audit Specialist" value="Audit Specialist" required>
      </div>

      <div class="form-group-modal">
        <label>DEPARTMENT</label>
        <input type="text" id="modal-dept" class="input-modal" placeholder="StrikeForce/Fraud Audit-IAD" value="StrikeForce/Fraud Audit-IAD" required>
      </div>

      <div class="form-group-modal">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="modal-email" class="input-modal" placeholder="e.g. j.doe@sfcaliquidation.biz" required>
      </div>

      <div class="form-group-modal">
        <label>DEFAULT PASSWORD</label>
        <input type="password" id="modal-password" class="input-modal" placeholder="Set password" required>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeEnrollModal()">Cancel</button>
        <button type="submit" class="btn-enroll-submit">+ Enroll User</button>
      </div>
    </form>
  </div>
</div>

<!-- FIREBASE SDK INITIALIZATION -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAx2EBFvZFTYyflmsDMs_GIQ4Y4e3n5v0g",
    authDomain: "qcl-recon.firebaseapp.com",
    databaseURL: "https://qcl-recon-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "qcl-recon",
    storageBucket: "qcl-recon.firebasestorage.app",
    messagingSenderId: "1025895074848",
    appId: "1:1025895074848:web:51742b4db399230b8f0045"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // FETCH ENROLLED USERS GIKAN SA FIREBASE
  function listenUsers() {
    onValue(ref(db, 'systemUsers'), (snapshot) => {
      const container = document.getElementById('users-list');
      container.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        Object.keys(data).forEach(key => {
          const u = data[key];
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div>
              <strong>${u.fullName || u.username}</strong>
              <div style="font-size:12px; color:var(--text-muted);">
                Username: <b>${u.username}</b> | ${u.position || 'Auditor'} (${u.department || 'IAD'})
              </div>
            </div>
            <span style="font-size:12px; font-weight:700; color:#16a34a;">Active</span>
          `;
          container.appendChild(div);
        });
      } else {
        container.innerHTML = `<div style="font-size:12px; color:var(--text-muted);">No enrolled users yet. Click "+ Enroll New User" above.</div>`;
      }
    });
  }

  // SAVE NEW ENROLLED USER TO FIREBASE
  window.handleEnrollUser = function(e) {
    e.preventDefault();

    const username = document.getElementById('modal-username').value.trim();
    const fullName = document.getElementById('modal-fullname').value.trim();
    const position = document.getElementById('modal-position').value.trim();
    const department = document.getElementById('modal-dept').value.trim();
    const email = document.getElementById('modal-email').value.trim();
    const password = document.getElementById('modal-password').value.trim();

    const newRef = push(ref(db, 'systemUsers'));
    set(newRef, {
      username,
      fullName,
      position,
      department,
      email,
      password,
      role: 'user',
      createdDate: new Date().toISOString()
    }).then(() => {
      alert(`✓ User "${fullName}" successfully enrolled!`);
      closeEnrollModal();
      document.getElementById('enroll-form').reset();
    }).catch(err => alert("Error enrolling user: " + err.message));
  };

  listenUsers();
</script>

<script>
  function switchTab(tabName) {
    document.getElementById('tab-btn-audit').classList.remove('active');
    document.getElementById('tab-btn-users').classList.remove('active');
    document.getElementById('content-audit').classList.remove('active');
    document.getElementById('content-users').classList.remove('active');

    if (tabName === 'audit') {
      document.getElementById('tab-btn-audit').classList.add('active');
      document.getElementById('content-audit').classList.add('active');
    } else {
      document.getElementById('tab-btn-users').classList.add('active');
      document.getElementById('content-users').classList.add('active');
    }
  }

  function openEnrollModal() {
    document.getElementById('enroll-modal-overlay').classList.add('show');
  }

  function closeEnrollModal() {
    document.getElementById('enroll-modal-overlay').classList.remove('show');
  }

  function toggleAddBranch() {
    const box = document.getElementById('add-branch-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  function openBranch(branchName) {
    window.location.href = `qcl.html?branch=${encodeURIComponent(branchName)}&role=admin`;
  }

  function logout() {
    localStorage.removeItem('ml_userRole');
    localStorage.removeItem('ml_activeUser');
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
