<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M Lhuillier — Admin Dashboard</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #cc0000;
    --dark-navy: #0f172a;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text: #334155;
    --text-muted: #64748b;
    --active-tab-bg: #0f172a; /* Dark Navy Pill */
    --active-tab-text: #ffffff;
    --inactive-tab-bg: #edf2f7;
    --inactive-tab-text: #334155;
    --radius-pill: 12px;
    --radius-search: 30px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-main);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 32px 28px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }

  /* HEADER BRAND & LOGOUT */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .brand-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-logout {
    background: #f1f5f9;
    color: #0f172a;
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-logout:hover { background: #e2e8f0; }

  /* NAVIGATION TABS DESIGN (GIKAN SA PICTURE) */
  .tab-navigation {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .nav-tab {
    background: var(--inactive-tab-bg);
    color: var(--inactive-tab-text);
    padding: 12px 24px;
    border-radius: var(--radius-pill);
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .nav-tab.active {
    background: var(--active-tab-bg);
    color: var(--active-tab-text);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
  }

  /* ROUNDED SEARCH BAR (GIKAN SA PICTURE) */
  .search-container {
    margin-bottom: 28px;
  }

  .search-wrapper {
    position: relative;
    max-width: 500px;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
  }

  .input-search-pill {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border-radius: var(--radius-search);
    border: 1px solid #cbd5e1;
    font-size: 14px;
    outline: none;
    color: var(--text);
    transition: border-color 0.2s;
  }

  .input-search-pill:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(204,0,0,0.1);
  }

  /* TAB CONTENT PANELS */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* CARDS & TABLES */
  .panel-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .list-item:last-child { border-bottom: none; }

  .btn-action {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-action:hover { background: #a00000; }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
  .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
</style>
</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="header-top">
    <div class="brand-title">
      <img src="logo.png" height="32" alt="ML Logo" onerror="this.style.display='none';">
      <span>M Lhuillier QCL Audit Portal</span>
    </div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <!-- TABS NAVIGATION (GIKAN SA PICTURE) -->
  <div class="tab-navigation">
    <button class="nav-tab active" id="tab-btn-audit" onclick="switchTab('audit')">
      📋 All Liquidations Audit
    </button>
    <button class="nav-tab" id="tab-btn-users" onclick="switchTab('users')">
      👥 User Profiles & Credentials
    </button>
  </div>

  <!-- SEARCH BAR (GIKAN SA PICTURE) -->
  <div class="search-container">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="dashboard-search" class="input-search-pill" placeholder="Search User Name, Email, Branch, or Region...">
    </div>
  </div>

  <!-- CONTENT 1: ALL LIQUIDATIONS / BRANCHES AUDIT -->
  <div id="content-audit" class="tab-content active">
    <div class="panel-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:16px; font-weight:800; color:var(--dark-navy);">🏢 Registered Branch Inventories</h3>
        <button class="btn-action" onclick="toggleAddBranch()">+ Enroll Branch</button>
      </div>

      <!-- Add Branch Form -->
      <div id="add-branch-box" style="display:none; background:#f8fafc; padding:16px; border-radius:12px; margin-bottom:16px; border:1px solid var(--border);">
        <div class="form-group">
          <label>Branch Name</label>
          <input type="text" id="new-branch-input" class="form-control" placeholder="e.g. ML Catarman Main">
        </div>
        <button class="btn-action" onclick="saveNewBranch()" style="width:100%;">Save Branch</button>
      </div>

      <div id="branches-list">
        <div class="list-item">
          <div>
            <strong>ML Catarman</strong>
            <div style="font-size:12px; color:var(--text-muted);">Region: Visayas</div>
          </div>
          <button class="btn-action" onclick="openBranch('ML Catarman')">Open Audit Engine</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENT 2: USER PROFILES & CREDENTIALS -->
  <div id="content-users" class="tab-content">
    <div class="panel-card">
      <h3 style="font-size:16px; font-weight:800; color:var(--dark-navy); margin-bottom:16px;">👤 User Profiles & Credentials</h3>
      
      <!-- Enroll New User Form -->
      <div style="background:#f8fafc; padding:16px; border-radius:12px; margin-bottom:20px; border:1px solid var(--border);">
        <h4 style="font-size:13px; font-weight:700; margin-bottom:12px;">Enroll New Auditor / Profile</h4>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="enroll-username" class="form-control" placeholder="Auditor Name">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="enroll-password" class="form-control" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Region / Branch</label>
            <input type="text" id="enroll-region" class="form-control" placeholder="e.g. Region 8">
          </div>
        </div>
        <button class="btn-action" onclick="enrollUser()" style="margin-top:8px;">Enroll User Profile</button>
      </div>

      <!-- Enrolled Users List -->
      <div id="users-list">
        <div class="list-item">
          <div>
            <strong>Admin Account</strong>
            <div style="font-size:12px; color:var(--text-muted);">Role: System Administrator</div>
          </div>
          <span style="font-size:12px; font-weight:700; color:#16a34a;">Active</span>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
  // TAB SWITCHING LOGIC
  function switchTab(tabName) {
    // Buttons
    document.getElementById('tab-btn-audit').classList.remove('active');
    document.getElementById('tab-btn-users').classList.remove('active');

    // Contents
    document.getElementById('content-audit').classList.remove('active');
    document.getElementById('content-users').classList.remove('active');

    if (tabName === 'audit') {
      document.getElementById('tab-btn-audit').classList.add('active');
      document.getElementById('content-audit').classList.add('active');
    } else {
      document.getElementById('tab-btn-users').classList.add('active');
      document.getElementById('content-users').classList.add('active');
    }
  }

  function toggleAddBranch() {
    const box = document.getElementById('add-branch-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  function openBranch(branchName) {
    window.location.href = `qcl.html?branch=${encodeURIComponent(branchName)}&role=admin`;
  }

  function logout() {
    localStorage.removeItem('ml_userRole');
    localStorage.removeItem('ml_activeUser');
    window.location.href = 'index.html';
  }

  function saveNewBranch() {
    const name = document.getElementById('new-branch-input').value.trim();
    if(!name) return alert('Please enter branch name.');
    alert(`Branch "${name}" enrolled successfully!`);
    document.getElementById('new-branch-input').value = '';
    toggleAddBranch();
  }

  function enrollUser() {
    const u = document.getElementById('enroll-username').value.trim();
    if(!u) return alert('Please enter username.');
    alert(`User profile "${u}" enrolled successfully!`);
    document.getElementById('enroll-username').value = '';
    document.getElementById('enroll-password').value = '';
    document.getElementById('enroll-region').value = '';
  }
</script>

</body>
</html>
