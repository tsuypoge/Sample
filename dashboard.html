<!-- ENROLL NEW USER MODAL POPUP -->
<div id="enroll-modal-overlay" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span style="color:var(--primary); font-size:18px;">+</span> Enroll New User
      </div>
      <button class="close-modal-btn" onclick="closeEnrollModal()">✕</button>
    </div>

    <form id="enroll-form" onsubmit="handleEnrollUser(event)">
      <div class="form-group-modal">
        <label>FULL NAME</label>
        <input type="text" id="modal-fullname" class="input-modal" placeholder="e.g. Rey John Duero" oninput="autoGenerateCredentials()" required>
      </div>

      <div class="form-group-modal">
        <label>USERNAME (AUTO-GENERATED)</label>
        <input type="text" id="modal-username" class="input-modal" placeholder="e.g. r.duero" readonly style="background:#f1f5f9; cursor:not-allowed;" required>
      </div>

      <div class="form-group-modal">
        <label>DESIGNATION / POSITION</label>
        <input type="text" id="modal-position" class="input-modal" placeholder="Audit Specialist" value="Audit Specialist" required>
      </div>

      <div class="form-group-modal">
        <label>DEPARTMENT</label>
        <input type="text" id="modal-dept" class="input-modal" placeholder="StrikeForce/Fraud Audit-IAD" value="StrikeForce/Fraud Audit-IAD" required>
      </div>

      <div class="form-group-modal">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="modal-email" class="input-modal" placeholder="e.g. r.duero@sfcaliquidation.biz" required>
      </div>

      <div class="form-group-modal">
        <label>DEFAULT PASSWORD (AUTO-GENERATED)</label>
        <input type="text" id="modal-password" class="input-modal" placeholder="Auto-generated from Last Name" readonly style="background:#f1f5f9; cursor:not-allowed;" required>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeEnrollModal()">Cancel</button>
        <button type="submit" class="btn-enroll-submit">+ Enroll User</button>
      </div>
    </form>
  </div>
</div>

<script>
  // AUTOMATIC GENERATOR LOGIC FOR USERNAME AND PASSWORD
  function autoGenerateCredentials() {
    const fullNameInput = document.getElementById('modal-fullname').value.trim();
    if (!fullNameInput) {
      document.getElementById('modal-username').value = '';
      document.getElementById('modal-password').value = '';
      document.getElementById('modal-email').value = '';
      return;
    }

    // Split words in name
    const nameParts = fullNameInput.toLowerCase().split(/\s+/).filter(Boolean);
    
    if (nameParts.length >= 2) {
      const firstNameInitial = nameParts[0].charAt(0); // Kuhaon ang 'r' gikan sa 'rey'
      const lastName = nameParts[nameParts.length - 1]; // Kuhaon ang 'duero'
      
      const generatedUsername = `${firstNameInitial}.${lastName}`;
      
      document.getElementById('modal-username').value = generatedUsername;
      document.getElementById('modal-password').value = lastName; // Default pass = apelyido
      document.getElementById('modal-email').value = `${generatedUsername}@sfcaliquidation.biz`;
    } else if (nameParts.length === 1) {
      document.getElementById('modal-username').value = nameParts[0];
      document.getElementById('modal-password').value = nameParts[0];
      document.getElementById('modal-email').value = `${nameParts[0]}@sfcaliquidation.biz`;
    }
  }
</script>
