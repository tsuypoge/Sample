<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M Lhuillier — Main Dashboard</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #cc0000;
    --primary-hover: #a00000;
    --dark: #0f172a;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: var(--bg-main);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand { font-size: 18px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  
  .user-badge {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; font-weight: 600; color: var(--dark);
  }

  .wrap { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }

  .card-title { font-size: 16px; font-weight: 700; color: var(--dark); }

  .btn {
    font-size: 13px; font-weight: 600; padding: 8px 14px;
    border-radius: 6px; border: 1px solid var(--border);
    background: #ffffff; color: var(--text); cursor: pointer;
    transition: all 0.15s;
  }

  .btn:hover { background: #f1f5f9; }
  .btn-primary { background: var(--primary); color: #fff; border: none; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-sm { padding: 4px 10px; font-size: 11px; }

  /* LISTS AND TABLES */
  .item-list { list-style: none; }
  .item-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #f1f5f9;
  }
  .item-row:last-child { border-bottom: none; }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
  .input-control {
    width: 100%; padding: 8px 12px; border-radius: 6px;
    border: 1px solid var(--border); font-size: 13px; outline: none;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.png" height="32" alt="ML Logo" onerror="this.style.display='none';">
    <span>QCL Audit Dashboard</span>
  </div>
  <div class="user-badge">
    <span id="current-user-display">👤 Admin</span>
    <button class="btn btn-sm" id="logout-btn">Logout</button>
  </div>
</header>

<div class="wrap">
  <div class="dashboard-grid">

    <!-- BRANCHES SECTION -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">🏢 Active Branches</span>
        <button class="btn btn-primary btn-sm" id="show-add-branch-modal">+ Add Branch</button>
      </div>

      <div class="form-group" id="add-branch-box" style="display:none; background:#f8fafc; padding:12px; border-radius:8px;">
        <label>New Branch Name</label>
        <input type="text" id="new-branch-name" class="input-control" placeholder="e.g. ML Catarman, ML Liloan 3">
        <button class="btn btn-primary btn-sm" id="save-branch-btn" style="margin-top:8px; width:100%;">Save Branch</button>
      </div>

      <ul class="item-list" id="branches-list-container">
        <li style="color:var(--text-muted); font-size:12px;">Loading branches from cloud database...</li>
      </ul>
    </div>

    <!-- USER PROFILES & ENROLLMENT SECTION -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">👥 User Profiles</span>
      </div>

      <div style="background:#f8fafc; padding:12px; border-radius:8px; margin-bottom:16px;">
        <span style="font-size:12px; font-weight:700; display:block; margin-bottom:8px;">Enroll New Auditor / User</span>
        <div class="form-group">
          <input type="text" id="enroll-username" class="input-control" placeholder="Username">
        </div>
        <div class="form-group">
          <input type="password" id="enroll-password" class="input-control" placeholder="Password">
        </div>
        <div class="form-group">
          <select id="enroll-role" class="input-control">
            <option value="user">Auditor / User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button class="btn btn-primary btn-sm" id="enroll-user-btn" style="width:100%;">Enroll User</button>
      </div>

      <span style="font-size:12px; font-weight:700; color:var(--text-muted);">Enrolled Users</span>
      <ul class="item-list" id="users-list-container" style="margin-top:8px;">
        <li style="color:var(--text-muted); font-size:12px;">Loading users...</li>
      </ul>
    </div>

  </div>
</div>

<!-- FIREBASE REALTIME ENGINE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAx2EBFvZFTYyflmsDMs_GIQ4Y4e3n5v0g",
    authDomain: "qcl-recon.firebaseapp.com",
    databaseURL: "https://qcl-recon-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "qcl-recon",
    storageBucket: "qcl-recon.firebasestorage.app",
    messagingSenderId: "1025895074848",
    appId: "1:1025895074848:web:51742b4db399230b8f0045"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const activeUser = localStorage.getItem('ml_activeUser') || 'Admin';
  const userRole = localStorage.getItem('ml_userRole') || 'admin';

  document.getElementById('current-user-display').textContent = `👤 ${activeUser} (${userRole.toUpperCase()})`;

  // LOGOUT
  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('ml_activeUser');
    localStorage.removeItem('ml_userRole');
    window.location.href = 'index.html';
  });

  // FETCH BRANCHES
  function listenBranches() {
    onValue(ref(db, 'systemBranches'), (snapshot) => {
      const container = document.getElementById('branches-list-container');
      container.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        Object.keys(data).forEach(key => {
          const b = data[key];
          const li = document.createElement('li');
          li.className = 'item-row';
          li.innerHTML = `
            <div>
              <strong style="font-size:13px;">${b.name}</strong>
              <div style="font-size:11px; color:var(--text-muted);">Added: ${b.createdDate || 'N/A'}</div>
            </div>
            <button class="btn btn-sm btn-primary open-audit-btn" data-branch="${b.name}">Open Audit</button>
          `;
          container.appendChild(li);
        });

        document.querySelectorAll('.open-audit-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const branchName = e.target.dataset.branch;
            window.location.href = `qcl.html?branch=${encodeURIComponent(branchName)}&role=${userRole}`;
          });
        });
      } else {
        container.innerHTML = `<li style="font-size:12px; color:var(--text-muted);">No branches added yet.</li>`;
      }
    });
  }

  // ADD BRANCH
  document.getElementById('show-add-branch-modal').addEventListener('click', () => {
    const box = document.getElementById('add-branch-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('save-branch-btn').addEventListener('click', () => {
    const name = document.getElementById('new-branch-name').value.trim();
    if (!name) return alert('Please enter branch name');

    const branchRef = push(ref(db, 'systemBranches'));
    set(branchRef, {
      name: name,
      createdDate: new Date().toISOString().slice(0, 10)
    });

    document.getElementById('new-branch-name').value = '';
    document.getElementById('add-branch-box').style.display = 'none';
  });

  // FETCH USERS
  function listenUsers() {
    onValue(ref(db, 'systemUsers'), (snapshot) => {
      const container = document.getElementById('users-list-container');
      container.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        Object.keys(data).forEach(key => {
          const u = data[key];
          const li = document.createElement('li');
          li.className = 'item-row';
          li.innerHTML = `
            <div>
              <strong style="font-size:13px;">${u.username}</strong>
              <span style="font-size:10px; background:#e2e8f0; padding:2px 6px; border-radius:4px; margin-left:4px;">${u.role}</span>
            </div>
          `;
          container.appendChild(li);
        });
      } else {
        container.innerHTML = `<li style="font-size:12px; color:var(--text-muted);">No users enrolled.</li>`;
      }
    });
  }

  // ENROLL USER
  document.getElementById('enroll-user-btn').addEventListener('click', () => {
    const user = document.getElementById('enroll-username').value.trim();
    const pass = document.getElementById('enroll-password').value.trim();
    const role = document.getElementById('enroll-role').value;

    if (!user || !pass) return alert('Enter username and password');

    const userRef = push(ref(db, 'systemUsers'));
    set(userRef, { username: user, password: pass, role: role });

    document.getElementById('enroll-username').value = '';
    document.getElementById('enroll-password').value = '';
    alert(`User "${user}" successfully enrolled!`);
  });

  listenBranches();
  listenUsers();
</script>

</body>
</html>
