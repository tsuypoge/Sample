<!-- FIREBASE MULTI-USER REALTIME ENGINE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAx2EBFvZFTYyflmsDMs_GIQ4Y4e3n5v0g",
    authDomain: "qcl-recon.firebaseapp.com",
    databaseURL: "https://qcl-recon-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "qcl-recon",
    storageBucket: "qcl-recon.firebasestorage.app",
    messagingSenderId: "1025895074848",
    appId: "1:1025895074848:web:51742b4db399230b8f0045"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentBranch = "";
  let currentAuditDate = "";
  let tickets = [];
  let html5QrCode = null;

  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));

  function slugBranch(name){ return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-') || 'default'; }

  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    currentBranch = urlParams.get('branch') || localStorage.getItem('ml_activeBranch') || 'ML Branch';
    currentAuditDate = urlParams.get('date') || localStorage.getItem('vaultledger:remembered-audit-date') || new Date().toISOString().slice(0,10);

    $('#branch-display').textContent = `🏢 ${currentBranch} (👑 ADMIN MODE)`;
    $('#date-display').textContent = `Audit Date: ${currentAuditDate}`;

    listenFirebaseStore();
  });

  // FIREBASE REALTIME LISTENER WITH "X PTNs SYNCED" NOTIFICATION
  function listenFirebaseStore() {
    const branchSlug = slugBranch(currentBranch);
    onValue(ref(db, `qclStore/${branchSlug}`), (snapshot) => {
      const val = snapshot.val();
      if (val && val.tickets) {
        tickets = val.tickets;
        renderTable();

        const count = tickets.length;
        const msg = `✓ ${count} PTNs synced`;
        
        // Dynamic Notification Status
        const statusTag = $('#network-status-tag');
        if (statusTag) statusTag.textContent = msg;

        // Update active upload card UI status
        if (val.lastCategory) {
          const card = document.querySelector(`.upload-card[data-cat="${val.lastCategory}"]`);
          if (card) {
            card.classList.add('done');
            let pEl = card.querySelector('.sync-msg');
            if (!pEl) {
              pEl = document.createElement('p');
              pEl.className = 'sync-msg';
              pEl.style.fontSize = '12px';
              pEl.style.fontWeight = 'bold';
              pEl.style.color = 'var(--success)';
              pEl.style.marginTop = '8px';
              card.appendChild(pEl);
            }
            pEl.textContent = msg;
          }
        }
      }
    });
  }

  function syncToFirebase(categoryKey) {
    if (!currentBranch) return;
    const branchSlug = slugBranch(currentBranch);
    set(ref(db, `qclStore/${branchSlug}`), { 
      tickets, 
      lastCategory: categoryKey || '',
      lastUpdated: new Date().toISOString() 
    });
  }

  function renderTable() {
    const body = $('#ledger-body');
    const query = $('#search').value.toLowerCase().trim();
    body.innerHTML = '';

    tickets.forEach((t, i) => {
      if (query && !t.ptn.toLowerCase().includes(query) && !t.desc.toLowerCase().includes(query)) return;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td class="ptn">${t.ptn}</td>
        <td>${t.date || '—'}</td>
        <td>${t.desc || '—'}</td>
        <td>₱${t.loan ? Number(t.loan).toLocaleString() : '0.00'}</td>
        <td style="text-align:center;"><input type="checkbox" class="found-check" data-idx="${i}" ${t.found ? 'checked' : ''}></td>
      `;
      body.appendChild(tr);
    });

    $$('.found-check').forEach(chk => {
      chk.addEventListener('change', (e) => {
        const idx = e.target.dataset.idx;
        tickets[idx].found = e.target.checked;
        syncToFirebase();
      });
    });
  }

  // FILE UPLOAD & AUTOMATIC PTN COUNT DETECTOR
  $$('.cat-upload-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelector(`.cat-file-input[data-cat="${btn.dataset.cat}"]`).click();
  }));

  $$('.cat-file-input').forEach(inp => inp.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const catKey = e.target.dataset.cat;
    if (!file) return;

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1});

    // Extract valid PTN rows
    const newTickets = [];
    rows.forEach(r => {
      if (r[0] && String(r[0]).match(/\d+/)) {
        newTickets.push({ 
          ptn: String(r[0]).trim(), 
          date: currentAuditDate, 
          desc: r[1] || 'Jewelry', 
          loan: r[2] || 0, 
          found: false 
        });
      }
    });

    if (newTickets.length > 0) {
      tickets = newTickets;
      syncToFirebase(catKey);
      renderTable();
      alert(`✓ Success! ${newTickets.length} PTNs synced to cloud database.`);
    } else {
      alert("⚠️ No valid PTN numbers found in uploaded file.");
    }
  }));

  // CAMERA SCANNER LOGIC
  $('#open-cam-btn').addEventListener('click', () => {
    $('#cam-modal-overlay').classList.add('show');
    if (!html5QrCode) html5QrCode = new Html5Qrcode("qr-reader");

    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
      const match = text.match(/\d{5,}-\d+/) || text.match(/\d+/);
      if (match) {
        const scannedPTN = match[0];
        const idx = tickets.findIndex(t => t.ptn.includes(scannedPTN));
        if (idx !== -1) {
          tickets[idx].found = true;
          syncToFirebase();
          renderTable();
          $('#cam-scan-result').style.color = "var(--success)";
          $('#cam-scan-result').textContent = `✓ MATCHED: ${scannedPTN}`;
        } else {
          $('#cam-scan-result').style.color = "var(--primary)";
          $('#cam-scan-result').textContent = `❌ NOT FOUND: ${scannedPTN}`;
        }
      }
    }).catch(err => alert('Camera access error. Please grant camera permission.'));
  });

  $('#close-cam-modal').addEventListener('click', () => {
    if (html5QrCode) html5QrCode.stop();
    $('#cam-modal-overlay').classList.remove('show');
  });

  $('#search').addEventListener('input', renderTable);
</script>
