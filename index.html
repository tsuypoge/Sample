<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M Lhuillier — QCL Portal Login</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #cc0000;
    --primary-hover: #a00000;
    --dark: #0f172a;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --font-sans: 'Inter', system-ui, sans-serif;
    --radius: 16px;
    --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-main);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .login-card {
    background: var(--card-bg);
    width: 100%;
    max-width: 380px;
    padding: 36px 28px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    border-top: 5px solid var(--primary);
    text-align: center;
  }

  .logo-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
  }

  .logo-img { height: 45px; width: auto; object-fit: contain; }

  h1 { font-size: 20px; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
  p.sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

  .form-group { text-align: left; margin-bottom: 16px; }

  label {
    display: block; font-size: 11px; font-weight: 700;
    color: var(--text-muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .input-control {
    width: 100%; padding: 12px 14px; border-radius: 8px;
    border: 1.5px solid var(--border); font-family: var(--font-sans);
    font-size: 14px; outline: none; transition: all 0.15s ease-in-out;
  }

  .input-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.1);
  }

  .btn-login {
    width: 100%; padding: 12px; background: var(--primary);
    color: #ffffff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    margin-top: 8px; transition: background 0.15s;
  }

  .btn-login:hover { background: var(--primary-hover); }

  .error-msg {
    color: #dc2626; background: #fef2f2; border: 1px solid #fecaca;
    padding: 8px 12px; border-radius: 6px; font-size: 12px;
    font-weight: 600; margin-bottom: 16px; display: none;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-container">
    <img src="logo.png" class="logo-img" alt="ML Logo" onerror="this.style.display='none';">
  </div>
  <h1>QCL Audit Portal</h1>
  <p class="sub">Sign in to start live inventory check</p>

  <div id="error-msg" class="error-msg">Please enter username and password.</div>

  <form id="login-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" class="input-control" placeholder="Enter username" autocomplete="off" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" class="input-control" placeholder="Enter password" autocomplete="off" required>
    </div>

    <button type="submit" class="btn-login">🔑 Login</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAx2EBFvZFTYyflmsDMs_GIQ4Y4e3n5v0g",
    authDomain: "qcl-recon.firebaseapp.com",
    databaseURL: "https://qcl-recon-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "qcl-recon",
    storageBucket: "qcl-recon.firebasestorage.app",
    messagingSenderId: "1025895074848",
    appId: "1:1025895074848:web:51742b4db399230b8f0045"
  };

  initializeApp(firebaseConfig);

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();

    if (!user || !pass) {
      document.getElementById('error-msg').style.display = 'block';
      return;
    }

    // Admin role validation check (admin / admin1234)
    let role = "user";
    if (user.toLowerCase() === "admin" && pass === "admin1234") {
      role = "admin";
    }

    const savedBranch = localStorage.getItem('ml_activeBranch') || 'ML Branch';

    // Save session state
    localStorage.setItem('ml_userRole', role);
    localStorage.setItem('ml_activeUser', user);

    // Redirect to main QCL dashboard
    window.location.href = `qcl.html?branch=${encodeURIComponent(savedBranch)}&role=${role}`;
  });
</script>

</body>
</html>
